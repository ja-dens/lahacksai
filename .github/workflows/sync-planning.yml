name: Sync sticker planning

on:
  push:
    branches:
      - main
      - codex/sticker-planning
    paths:
      - planning/backlog.json
      - planning/issues/**
      - planning/PULL_REQUEST_BODY.md
      - .github/scripts/sync-planning*
      - .github/workflows/sync-planning.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: sticker-planning-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ja-dens/lahacksai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the reviewed planning source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the planning publisher
        run: |
          node --test .github/scripts/sync-planning.test.cjs
          node .github/scripts/sync-planning.cjs --dry-run
      - name: Publish task issues and record actual links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-planning.cjs --apply
