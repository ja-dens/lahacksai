name: Combined application
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the combined locked environment
        run: python -m pip install -r requirements.lock
      - name: Compile and test every component together
        run: |
          python -m pip check
          python -m compileall -q src
          python -m unittest discover -s tests
          python -I -S scripts/check_contract_fixtures.py
          python -S -m unittest discover -s checks -p 'test_contract_fixtures.py'
      - name: Exercise offline commands
        run: |
          python -m src demo --db local-data/ci-group.sqlite3 --case opposing --replay
          python -m src demo --db local-data/ci-direct.sqlite3 --direct --replay
          python -m src mock-demo --case compatible --replay
          python -m src.adapters.fetch_agent --demo
          python agent.py --check
