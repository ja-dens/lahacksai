name: T5 mock integration

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - tests/test_integration.py
      - tests/test_context_store.py
      - tests/test_python_runtime.py
      - requirements-t5.txt
      - config/defaults.v2.json
      - fixtures/contracts/**
      - fixtures/stickers/laughing.png
      - .github/workflows/t5-mock-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install isolated mock-harness runtime
        run: python -m pip install -r requirements-t5.txt
      - name: Check coordinator and offline integration
        run: |
          python -m compileall -q src
          python -S -m unittest discover -s tests -p 'test_integration.py' -v
          python -S -m unittest discover -s tests -p 'test_context_store.py'
          python -S -m unittest discover -s tests -p 'test_python_runtime.py'
          python -m src mock-demo --case opposing --replay
          python -I -S scripts/check_contract_fixtures.py
          python -S -m unittest discover -s checks -p 'test_contract_fixtures.py'
